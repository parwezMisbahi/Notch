name: Build Docera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Create signing key (only if docera.jks is missing)
        run: |
          if [ ! -f docera.jks ]; then
            keytool -genkeypair -v -keystore docera.jks -alias docera \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass docera123 -keypass docera123 \
              -dname "CN=Docera, O=Docera, C=IN"
          fi

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Docera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
